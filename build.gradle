plugins {
    id 'fml-loom' version '0.1'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
    maven { name = 'ModdedMITE'; url = 'https://maven.limingzxc.top/repository/maven-public/' }
    mavenCentral()
}

configurations { fml }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation 'it.unimi.dsi:fastutil:8.5.12'
    implementation 'com.google.code.gson:gson:2.11.0'
    fml "com.github.MinecraftIsTooEasy:FishModLoader:${project.loader_version}"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:${project.loader_version}"
    implementation 'com.github.MinecraftIsTooEasy:RustedIronCore:1.5.5'
    compileOnly files('../Curios-MITE/build/libs/curios-mite-0.1.0.jar')
}

def fmlResolvedFile = configurations.fml.singleFile
def curiosRuntimeJar = file('../Curios-MITE/build/libs/curios-mite-0.1.0.jar')

def syncCuriosRuntimeMod = tasks.register('syncCuriosRuntimeMod', Copy) {
    from(curiosRuntimeJar)
    into(layout.projectDirectory.dir('run/mods'))
    doFirst {
        if (!curiosRuntimeJar.isFile()) {
            throw new GradleException("Curios-MITE runtime jar not found at ${curiosRuntimeJar}; build Curios-MITE first.")
        }
    }
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn(syncCuriosRuntimeMod)
}

loom {
    accessWidenerPath = file('src/main/resources/bountifulbaubles.accesswidener')
    mergedMinecraftJar()
    setFML(fmlResolvedFile)
    dependencies.add('mappings', fmlMCPMappings())
    mods {
        bountifulbaubles { sourceSet sourceSets.main }
    }
    runs {
        client {
            programArgs '--userProperties', '{}', '--username', project.username,
                '--session', 'a.a.a.a', '--width', project.screen_width, '--height', project.screen_height
        }
    }
}

processResources {
    inputs.properties(version: project.version, id: project.mod_id, name: project.mod_name)
    filesMatching('fml.mod.json') { expand(inputs.properties) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
